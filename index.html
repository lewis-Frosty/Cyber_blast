<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CYBER BLAST — prototype</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2300F0FF%27/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; background: #07070F; height: 100%; overflow: hidden; }
      /* Phaser centres the canvas itself (Scale.CENTER_BOTH) and absolutely
         positions its DOM-element container inside this div. Flex-centring here
         as well moved that container off the canvas, which is why DOM inputs
         rendered in the wrong place; `position: relative` gives the container
         the right box to resolve against. */
      #game { position: relative; width: 100%; height: 100%; }
      canvas { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
